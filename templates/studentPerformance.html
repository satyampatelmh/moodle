{% extends "base.html" %}
{% block body %}

<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="mb-0">Your Performance Graph</h2>
        <a href="{{ url_for('studentDashboard') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to DashBoard
        </a>
    </div>

    <div class="text-center">
        <img src="data:image/png;base64,{{ graph_url }}" class="img-fluid shadow rounded">
    </div>
</div>

{% endblock %}
