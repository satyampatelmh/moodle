{% extends 'base.html' %}
{% block body %}

<div class="container d-flex justify-content-center pt-5 fade-in">
    <div class="card custom-card shadow-lg p-5 text-center" style="max-width: 500px; width: 100%;">
        <div class="mb-4 text-primary">
            <i class="fa-solid fa-magnifying-glass fa-3x"></i>
        </div>
        <h2 class="card-title fw-bold mb-3">Search Student</h2>
        <p class="text-muted mb-4">Enter a Student ID to view their history and performance.</p>

        <form method="POST" action="{{ url_for('studentHistory') }}">
            <div class="input-group mb-3">
                <span class="input-group-text bg-light"><i class="fa-regular fa-id-card"></i></span>
                <input type="number" class="form-control form-control-lg" name="student_id" placeholder="Ex: 101"
                    required>
            </div>
            <button type="submit" class="btn btn-primary-custom w-100 py-3 fw-bold">Search History</button>
        </form>

        <div class="mt-4">
            <a href="{{ url_for('teacherDashboard') }}" class="text-decoration-none text-secondary">
                <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
            </a>
        </div>
    </div>
</div>

{% endblock %}
