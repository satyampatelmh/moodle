{% extends 'base.html' %}
{% block body %}

<div class="container pt-5 fade-in">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="h4 fw-bold text-primary mb-0">Student Search</h2>
        <a href="{{ url_for('teacherDashboard') }}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Back to Dashboard
        </a>
    </div>

    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card custom-card shadow-sm p-4">
                <h3 class="h5 fw-bold mb-2">Search by Student Name</h3>
                <p class="text-muted mb-4">Type a name and pick a student.</p>

                <form method="POST" action="{{ url_for('studentHistory') }}" id="studentSearchForm">
                    <label for="studentName" class="form-label">Student Name</label>
                    <input
                        type="text"
                        class="form-control mb-2"
                        id="studentName"
                        placeholder="e.g. Rahul"
                        autocomplete="off"
                        required
                    >

                    <ul id="suggestionsList" class="list-group mb-2" style="display:none; max-height: 220px; overflow-y: auto;"></ul>

                    <input type="hidden" name="student_id" id="studentIdHidden" required>
                    <div id="nameFeedback" class="small mb-3" style="display:none;"></div>

                    <button type="submit" class="btn btn-primary-custom w-100">View History</button>
                </form>

                <a href="{{ url_for('viewStudents') }}" class="btn btn-link text-decoration-none mt-3 px-0">
                    View all students
                </a>
            </div>
        </div>
    </div>
</div>

<script>
    const students = [
        {% for student in students %}
        { id: {{ student.id }}, name: {{ student.full_name|tojson }} },
        {% endfor %}
    ];

    const form = document.getElementById("studentSearchForm");
    const nameInput = document.getElementById("studentName");
    const hiddenId = document.getElementById("studentIdHidden");
    const suggestionsList = document.getElementById("suggestionsList");
    const nameFeedback = document.getElementById("nameFeedback");

    function bubbleSortByName(list) {
        const n = list.length;
        for (let i = 0; i < n - 1; i++) {
            let swapped = false;
            for (let j = 0; j < n - i - 1; j++) {
                if (list[j].name.toLowerCase() > list[j + 1].name.toLowerCase()) {
                    const temp = list[j];
                    list[j] = list[j + 1];
                    list[j + 1] = temp;
                    swapped = true;
                }
            }
            if (!swapped) break;
        }
    }

    function linearSearchMatches(list, query) {
        const matches = [];
        const q = query.toLowerCase();

        for (let i = 0; i < list.length; i++) {
            if (list[i].name.toLowerCase().includes(q)) {
                matches.push(list[i]);
            }
        }

        return matches;
    }

    function showFeedback(message, type) {
        nameFeedback.style.display = "block";
        nameFeedback.className = "small mb-3";
        if (type === "error") {
            nameFeedback.classList.add("text-danger");
        } else {
            nameFeedback.classList.add("text-success");
        }
        nameFeedback.textContent = message;
    }

    function hideFeedback() {
        nameFeedback.style.display = "none";
        nameFeedback.textContent = "";
    }

    function hideSuggestions() {
        suggestionsList.style.display = "none";
        suggestionsList.innerHTML = "";
    }

    function renderSuggestions(matches) {
        suggestionsList.innerHTML = "";

        if (matches.length === 0) {
            hideSuggestions();
            return;
        }

        for (let i = 0; i < matches.length && i < 8; i++) {
            const student = matches[i];
            const item = document.createElement("li");
            item.className = "list-group-item list-group-item-action";
            item.textContent = student.name + " (ID: " + student.id + ")";

            item.addEventListener("click", function () {
                nameInput.value = student.name;
                hiddenId.value = student.id;
                hideSuggestions();
                hideFeedback();
            });

            suggestionsList.appendChild(item);
        }

        suggestionsList.style.display = "block";
    }

    nameInput.addEventListener("input", function () {
        hiddenId.value = "";
        const query = nameInput.value.trim();

        if (!query) {
            hideSuggestions();
            hideFeedback();
            return;
        }

        const matches = linearSearchMatches(students, query);
        renderSuggestions(matches);

        if (matches.length === 0) {
            showFeedback("No matching students found.", "error");
        } else {
            hideFeedback();
        }
    });

    document.addEventListener("click", function (event) {
        if (!suggestionsList.contains(event.target) && event.target !== nameInput) {
            hideSuggestions();
        }
    });

    form.addEventListener("submit", function (event) {
        if (!hiddenId.value) {
            event.preventDefault();
            showFeedback("Please select a name from the list.", "error");
        }
    });

    bubbleSortByName(students);
</script>

{% endblock %}
