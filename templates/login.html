{% extends "base.html" %}
{% block body %}

<div class="container d-flex justify-content-center align-items-center" style="min-height: 70vh;">
  <div class="card custom-card shadow-lg p-4 fade-in" style="width: 100%; max-width: 400px;">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="bg-indigo-100 rounded-full p-3 d-inline-block mb-3">
          <i class="fa-solid fa-right-to-bracket text-primary fa-2x"></i>
        </div>
        <h2 class="card-title fw-bold">Welcome Back</h2>
        <p class="text-muted small">Access your dashboard</p>
      </div>

      {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form action="{{ url_for('login') }}" method="POST">
        <div class="mb-3">
          <label for="username" class="form-label fw-semibold">Username</label>
          <input type="text" class="form-control" name="username" id="username" placeholder="Enter your username"
            required>
        </div>
        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <input type="password" class="form-control" name="password" id="password" placeholder="••••••••" required>
        </div>
        <div class="d-grid">
          <button type="submit" class="btn btn-primary-custom btn-lg">Login</button>
        </div>
      </form>

      <div class="text-center mt-4">
        <p class="small text-muted">Don't have an account? <a href="{{ url_for('showRegister') }}"
            class="text-primary fw-bold text-decoration-none">Sign up</a></p>
      </div>
    </div>
  </div>
</div>

{% endblock %}
