{% extends "base.html" %}
{% block body %}

<div class="container d-flex justify-content-center align-items-center py-5">
  <div class="card custom-card shadow-lg p-4 fade-in" style="width: 100%; max-width: 500px;">
    <div class="card-body">
      <div class="text-center mb-4">
        <div class="bg-indigo-100 rounded-full p-3 d-inline-block mb-3">
          <i class="fa-solid fa-user-plus text-primary fa-2x"></i>
        </div>
        <h2 class="card-title fw-bold">Create Account</h2>
        <p class="text-muted small">Join our learning community today</p>
      </div>

      {% if error %}
      <div class="alert alert-danger" role="alert">
        {{ error }}
      </div>
      {% endif %}

      <form action="{{ url_for('register') }}" method="POST" id="registerForm">
        <div id="validationError" class="alert alert-danger d-none" role="alert"></div>

        <div class="mb-3">
          <label for="full_name" class="form-label fw-semibold">Full Name</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-regular fa-user"></i></span>
            <input type="text" class="form-control" name="full_name" id="full_name" placeholder="John Doe" required>
          </div>
        </div>

        <div class="row g-3 mb-3">
          <div class="col-md-6">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" name="username" id="username" placeholder="johndoe123" required>
          </div>
          <div class="col-md-6">
            <label for="mobile" class="form-label fw-semibold">Mobile</label>
            <input type="tel" class="form-control" name="mobile" id="mobile" placeholder="1234567890" required>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label fw-semibold">Email Address</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-regular fa-envelope"></i></span>
            <input type="email" class="form-control" name="email" id="email" placeholder="name@example.com" required>
          </div>
        </div>

        <div class="mb-4">
          <label for="password" class="form-label fw-semibold">Password</label>
          <div class="input-group">
            <span class="input-group-text bg-light"><i class="fa-solid fa-lock"></i></span>
            <input type="password" class="form-control" name="password" id="password"
              placeholder="Create a strong password" required>
          </div>
        </div>

        <div class="d-grid">
          <button type="submit" class="btn btn-primary-custom btn-lg">Register</button>
        </div>
      </form>

      <div class="text-center mt-4">
        <p class="small text-muted">Already have an account? <a href="{{ url_for('showLogin') }}"
            class="text-primary fw-bold text-decoration-none">Login</a></p>
      </div>
    </div>
  </div>
</div>

<script>
  const form = document.getElementById("registerForm");
  const username = document.getElementById("username");
  const mobile = document.getElementById("mobile");
  const email = document.getElementById("email");
  const password = document.getElementById("password");
  const errorBox = document.getElementById("validationError");

  const usernameRegex = /^[A-Za-z]{3,}[A-Za-z0-9_]*$/;
  const mobileRegex = /^\d{10}$/;
  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[^A-Za-z0-9]).{8,}$/;

  form.addEventListener("submit", function (e) {
    if (!usernameRegex.test(username.value.trim())) {
      e.preventDefault();
      errorBox.textContent = "Username must start with at least 3 alphabets. Numbers and underscore are allowed thereafter.";
      errorBox.classList.remove("d-none");
      return;
    }

    if (!emailRegex.test(email.value.trim())) {
      e.preventDefault();
      errorBox.textContent = "Please enter a valid email address.";
      errorBox.classList.remove("d-none");
      return;
    }

    if (!mobileRegex.test(mobile.value.trim())) {
      e.preventDefault();
      errorBox.textContent = "Phone number must be exactly 10 digits.";
      errorBox.classList.remove("d-none");
      return;
    }

    if (!passwordRegex.test(password.value)) {
      e.preventDefault();
      errorBox.textContent = "Password must be at least 8 characters and include uppercase, lowercase, number, and special character.";
      errorBox.classList.remove("d-none");
      return;
    }

    errorBox.classList.add("d-none");
    errorBox.textContent = "";
  });
</script>

{% endblock %}
